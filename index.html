<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fritos C.A. - Ventas</title>
    <style>
        :root {
            --primary: #FF6600; /* Naranja Fritos */
            --secondary: #FFCC00; /* Amarillo */
            --dark: #2d2d2d;
            --light: #f4f4f4;
            --white: #ffffff;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--light); color: var(--dark); }
        
        /* Header & Nav */
        header { background: var(--primary); color: white; padding: 1rem; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: auto; }
        .logo { height: 50px; border-radius: 5px; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; margin-left: 20px; font-size: 0.9rem; }

        /* Catalogo */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .price { font-size: 1.2rem; color: var(--primary); font-weight: bold; margin: 10px 0; }
        .btn-add { background: var(--secondary); border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Modal Pedido */
        #modal-confirm { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .tasa-box { background: #e3f2fd; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; border-left: 5px solid #2196f3; }
        
        .footer-info { text-align: center; padding: 2rem; font-size: 0.8rem; color: #666; }
        .badge-qty { background: red; color: white; padding: 2px 6px; border-radius: 50%; font-size: 10px; vertical-align: top; }
    </style>
</head>
<body>

<header>
    <nav>
        <div style="display: flex; align-items: center;">
            <img src="logo.jpg" alt="Logo Fritos" class="logo">
            <span style="margin-left: 10px; font-size: 1.2rem; font-weight: bold;">Fritos C.A.</span>
        </div>
        <div class="nav-links">
            <a href="javascript:void(0)" onclick="toggleAcerca()">Acerca de</a>
            <a href="javascript:void(0)" onclick="verPedido()" style="background: var(--dark); padding: 8px 15px; border-radius: 20px;">
                🛒 Carrito <span id="cart-count" class="badge-qty">0</span>
            </a>
        </div>
    </nav>
</header>

<div class="container">
    <div id="tasa-display" style="text-align: right; margin-bottom: 10px; font-weight: bold;">Cargando tasa BCV...</div>
    <div class="menu-grid" id="menu-container">
        </div>
</div>

<div id="modal-confirm">
    <div class="modal-content">
        <h3>Confirmar Pedido</h3>
        <div id="tasa-info-modal" class="tasa-box"></div>
        <div id="lista-pedido"></div>
        <hr>
        <div id="total-pedido" style="font-weight: bold; font-size: 1.1rem;"></div>
        <br>
        <button class="btn-add" style="background: #25D366; color: white;" onclick="enviarWhatsApp()">Enviar a WhatsApp</button>
        <button class="btn-add" style="background: #ccc; margin-top: 10px;" onclick="cerrarModal()">Seguir Comprando</button>
    </div>
</div>

<div id="modal-acerca" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; color: white; padding: 50px;">
    <h2>Información del Desarrollador</h2>
    <p><strong>Antonio Itriago</strong></p>
    <p>Analista, Diseñador y Desarrollador de Sistemas de Información Computarizados.</p>
    <p>Contacto: <a href="https://wa.me/584122525407" style="color: var(--secondary);">wa.me/584122525407</a></p>
    <button onclick="toggleAcerca()">Cerrar</button>
</div>

<script>
    // --- CONFIGURACIÓN Y TASA ---
    const CONFIG = {
        API: { BCV_URL: 'https://pydolarve.org/api/v1/dollar?page=bcv' }, // API sugerida para obtener el dato
        KEY_LAST_BCV: 'last_bcv_rate',
        SHEET_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsTRhoswf3zopWO5PEusQsYdYglnUlWTX9HzFIvewpy4vED9fQbs9Z0V3EdQ-AGMGLlpmcs_LL_cP3/pub?gid=0&single=true&output=tsv',
        WHATSAPP: '584122525407'
    };

    let tasaActual = 0;
    let productos = [];
    let carrito = [];

    async function obtenerTasaBCV() {
        try {
            // Nota: En un entorno real, fetch a BCV directo suele dar CORS. 
            // Se usa un proxy o se asume que la URL de CONFIG funciona.
            const response = await fetch(CONFIG.API.BCV_URL);
            const data = await response.json();
            tasaActual = data.monitors.bcv.price || data.promedio;
            localStorage.setItem(CONFIG.KEY_LAST_BCV, tasaActual);
        } catch (e) {
            tasaActual = parseFloat(localStorage.getItem(CONFIG.KEY_LAST_BCV)) || 0;
        }
        document.getElementById('tasa-display').innerText = `Tasa BCV: ${tasaActual.toFixed(2)} Bs.`;
    }

    // --- CARGA DE DATOS DESDE GOOGLE SHEETS ---
    async function cargarProductos() {
        const res = await fetch(CONFIG.SHEET_URL);
        const data = await res.text();
        const filas = data.split('\n').slice(1); // Saltar cabecera
        
        productos = filas.map(fila => {
            const [id, name, price, currency, description, category] = fila.split('\t');
            return { id, name, price: parseFloat(price), currency, description, category };
        }).filter(p => p.id);

        renderProductos();
    }

    function renderProductos() {
        const container = document.getElementById('menu-container');
        container.innerHTML = productos.map(p => `
            <div class="product-card">
                <h3>${p.name}</h3>
                <p style="font-size: 0.8rem; color: #666;">${p.description}</p>
                <div class="price">$${p.price.toFixed(2)}</div>
                <button class="btn-add" onclick="agregarAlCarrito('${p.id}')">Agregar</button>
            </div>
        `).join('');
    }

    // --- LÓGICA DEL CARRITO ---
    function agregarAlCarrito(id) {
        const prod = productos.find(p => p.id === id);
        const item = carrito.find(i => i.id === id);
        if(item) { item.cantidad++; } else { carrito.push({...prod, cantidad: 1}); }
        actualizarBadge();
    }

    function actualizarBadge() {
        const total = carrito.reduce((acc, cur) => acc + cur.cantidad, 0);
        document.getElementById('cart-count').innerText = total;
    }

    function verPedido() {
        if(carrito.length === 0) return alert("El carrito está vacío");
        const modal = document.getElementById('modal-confirm');
        const lista = document.getElementById('lista-pedido');
        const tasaInfo = document.getElementById('tasa-info-modal');
        
        tasaInfo.innerText = `Tasa del día: 1 USD = ${tasaActual} Bs.`;
        
        let html = "<ul>";
        let totalUSD = 0;
        
        carrito.forEach(item => {
            const subtotal = item.price * item.cantidad;
            totalUSD += subtotal;
            html += `<li>${item.cantidad}x ${item.name} - $${subtotal.toFixed(2)}</li>`;
        });
        html += "</ul>";
        
        const totalBS = totalUSD * tasaActual;
        
        lista.innerHTML = html;
        document.getElementById('total-pedido').innerHTML = `
            Total USD: $${totalUSD.toFixed(2)}<br>
            Total Bs: ${totalBS.toFixed(2)} Bs.
        `;
        
        modal.style.display = 'flex';
    }

    function enviarWhatsApp() {
        let mensaje = "¡Hola Fritos C.A.! Quisiera hacer el siguiente pedido:\n\n";
        let totalUSD = 0;
        
        carrito.forEach(item => {
            const sub = item.price * item.cantidad;
            totalUSD += sub;
            mensaje += `- ${item.cantidad}x ${item.name} ($${sub.toFixed(2)})\n`;
        });
        
        const totalBS = totalUSD * tasaActual;
        mensaje += `\n*Total a pagar:* $${totalUSD.toFixed(2)} / ${totalBS.toFixed(2)} Bs.`;
        mensaje += `\n(Tasa BCV: ${tasaActual} Bs.)`;

        const url = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
        carrito = [];
        actualizarBadge();
        cerrarModal();
    }

    function cerrarModal() { document.getElementById('modal-confirm').style.display = 'none'; }
    function toggleAcerca() { 
        const m = document.getElementById('modal-acerca');
        m.style.display = m.style.display === 'none' ? 'block' : 'none';
    }

    // Inicialización
    window.onload = () => {
        obtenerTasaBCV();
        cargarProductos();
    };
</script>

</body>
</html>
